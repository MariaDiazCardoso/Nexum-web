# ==========================================
# NEXUM — Configuración general
# ==========================================
spring.application.name=nexum-backend
server.port=${PORT:8081}

# ==========================================
# PostgreSQL  (T01 — variables de entorno, D6)
# Definir en el sistema: DB_URL, DB_USER, DB_PASSWORD
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexum}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate  (D6 — ddl-auto=update)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# show-sql solo para desarrollo local; deshabilitar en producción
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# El docente configura el dialecto; si Hibernate advierte que es innecesario es solo un warning
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect