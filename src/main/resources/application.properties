# ==========================================
# NEXUM — Configuración general
# ==========================================
spring.application.name=nexum-backend
server.port=${PORT:8081}

# ==========================================
# PostgreSQL  (T01 — variables de entorno, D6)
# Definir en el sistema: DB_URL, DB_USER, DB_PASSWORD
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexum}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / Hibernate  (D6 — ddl-auto=update)
# ==========================================
spring.jpa.hibernate.ddl-auto=update
# show-sql solo para desarrollo local (SHOW_SQL=true); apagado por defecto y en producción
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SHOW_SQL:false}
# Los planes gratis de BD en la nube permiten pocas conexiones
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# El docente configura el dialecto; si Hibernate advierte que es innecesario es solo un warning
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# Seguridad / JWT / CORS  (T11b)
# Definir JWT_SECRET como Base64 de al menos 32 bytes.
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:30}
cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200,https://nexum-web-tau.vercel.app}
